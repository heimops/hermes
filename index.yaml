apiVersion: v1
entries:
  hermes:
  - annotations:
      artifacthub.io/changes: |
        - kind: added
          description: Initial release of the Hermes database migration operator
        - kind: added
          description: DatabaseMigration CRD supporting MySQL and PostgreSQL
        - kind: added
          description: One-time Job and scheduled CronJob migration modes
        - kind: added
          description: Cross-database DDL and type translation (MySQL <-> PostgreSQL)
      artifacthub.io/crds: |
        - kind: DatabaseMigration
          version: v1alpha1
          name: databasemigrations.hermes.io
          displayName: Database Migration
          description: >
            Defines a migration from a source to a destination database.
            Supports MySQL and PostgreSQL in any combination.
      artifacthub.io/crdsExamples: |
        - apiVersion: hermes.io/v1alpha1
          kind: DatabaseMigration
          metadata:
            name: example-mysql-to-pg
            namespace: hermes-system
          spec:
            mode: once
            source:
              type: mysql
              host: mysql.example.svc.cluster.local
              database: myapp
              secretRef:
                name: source-db-secret
            destination:
              type: postgresql
              host: postgres.example.svc.cluster.local
              database: myapp
              secretRef:
                name: dest-db-secret
      artifacthub.io/license: Apache-2.0
      artifacthub.io/links: |
        - name: Documentation
          url: https://github.com/hermesops/hermes/blob/main/README.md
        - name: Source Code
          url: https://github.com/hermesops/hermes
        - name: Bug Tracker
          url: https://github.com/hermesops/hermes/issues
      artifacthub.io/operator: "true"
      artifacthub.io/operatorCapabilities: Basic Install
      artifacthub.io/prerelease: "false"
      artifacthub.io/recommendations: |
        - url: https://artifacthub.io/packages/helm/external-secrets/external-secrets
