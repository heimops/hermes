name: CI

on:
  push:
    branches:
      - main
    paths:
      - 'operator/**'
      - 'migrator/**'
      - '.github/workflows/ci.yml'

permissions:
  contents: read
  packages: write

jobs:
  build-operator:
    name: Build & Push hermes-operator
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract short SHA
        id: meta
        run: echo "sha=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: operator
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/hermes-operator:main
            ghcr.io/${{ github.repository_owner }}/hermes-operator:${{ steps.meta.outputs.sha }}
          cache-from: type=gha,scope=operator
          cache-to: type=gha,mode=max,scope=operator

  build-migrator:
    name: Build & Push hermes-migrator
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract short SHA
        id: meta
        run: echo "sha=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: migrator
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/hermes-migrator:main
            ghcr.io/${{ github.repository_owner }}/hermes-migrator:${{ steps.meta.outputs.sha }}
          cache-from: type=gha,scope=migrator
          cache-to: type=gha,mode=max,scope=migrator
