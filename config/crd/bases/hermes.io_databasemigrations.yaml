apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: databasemigrations.hermes.io
spec:
  group: hermes.io
  scope: Namespaced
  names:
    plural: databasemigrations
    singular: databasemigration
    kind: DatabaseMigration
    shortNames:
      - dbm
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Source
          type: string
          jsonPath: .spec.source.host
        - name: Destination
          type: string
          jsonPath: .spec.destination.host
        - name: Mode
          type: string
          jsonPath: .spec.mode
        - name: Ready
          type: string
          jsonPath: '.status.conditions[?(@.type=="Ready")].status'
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [source, destination]
              properties:
                source:
                  type: object
                  required: [type, host, database, secretRef]
                  properties:
                    type:
                      type: string
                      enum: [mysql, postgresql]
                    host:
                      type: string
                    port:
                      type: integer
                      format: int32
                      minimum: 1
                      maximum: 65535
                    database:
                      type: string
                    secretRef:
                      type: object
                      required: [name]
                      properties:
                        name:
                          type: string
                        usernameKey:
                          type: string
                          default: username
                        passwordKey:
                          type: string
                          default: password
                    sslMode:
                      type: string
                destination:
                  type: object
                  required: [type, host, database, secretRef]
                  properties:
                    type:
                      type: string
                      enum: [mysql, postgresql]
                    host:
                      type: string
                    port:
                      type: integer
                      format: int32
                      minimum: 1
                      maximum: 65535
                    database:
                      type: string
                    secretRef:
                      type: object
                      required: [name]
                      properties:
                        name:
                          type: string
                        usernameKey:
                          type: string
                          default: username
                        passwordKey:
                          type: string
                          default: password
                    sslMode:
                      type: string
                mode:
                  type: string
                  enum: [once, schedule]
                  default: once
                schedule:
                  type: string
                options:
                  type: object
                  properties:
                    schema:
                      type: boolean
                      default: true
                    data:
                      type: boolean
                      default: true
                    tables:
                      type: array
                      items:
                        type: string
                    batchSize:
                      type: integer
                      format: int32
                      minimum: 1
                      default: 1000
                image:
                  type: string
            status:
              type: object
              properties:
                jobRef:
                  type: string
                lastMigrationTime:
                  type: string
                  format: date-time
                conditions:
                  type: array
                  x-kubernetes-list-map-keys: [type]
                  x-kubernetes-list-type: map
                  items:
                    type: object
                    required: [type, status, lastTransitionTime, reason]
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                      observedGeneration:
                        type: integer
                        format: int64
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
